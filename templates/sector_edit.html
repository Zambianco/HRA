{% extends "base.html" %}

{% block title %}Editar Setor{% endblock %}

{% block content %}
  <div class="row mb-4">
    <div class="col-12">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a href="{% url 'employees_page' %}">Início</a></li>
          <li class="breadcrumb-item"><a href="{% url 'sectors_page' %}">Setores</a></li>
          <li class="breadcrumb-item active" aria-current="page">Editar</li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-lg-8">
      <h1 class="fw-bold text-primary mb-1">Editar Setor</h1>
      <p class="text-muted mb-0">Atualize os dados do setor selecionado.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-bottom p-3">
      <h5 class="fw-semibold mb-0">Dados do Setor</h5>
    </div>
    <form method="post" action="{% url 'sector_edit_page' sector.id %}">
      {% csrf_token %}
      <div class="card-body">
        <label for="area_id" class="form-label fw-semibold">Area</label>
        <select id="area_id" name="area_id" class="form-select mb-3" required>
          <option value="">Selecione uma area...</option>
          {% for area in active_areas %}
            <option value="{{ area.id }}" {% if sector.department and sector.department.area_id == area.id %}selected{% endif %}>{{ area.nome }}</option>
          {% endfor %}
        </select>

        <label for="department_id" class="form-label fw-semibold">Departamento</label>
        <select id="department_id" name="department_id" class="form-select mb-3" required>
          <option value="">Selecione um departamento...</option>
          {% for department in active_departments %}
            <option value="{{ department.id }}" data-area-id="{{ department.area_id }}" {% if sector.department_id == department.id %}selected{% endif %}>{{ department.nome }}</option>
          {% endfor %}
        </select>

        <label for="nome" class="form-label fw-semibold">Nome do setor</label>
        <input
          id="nome"
          name="nome"
          type="text"
          value="{{ sector.nome }}"
          maxlength="120"
          class="form-control"
          required
        />
      </div>
      <div class="card-footer bg-white border-top py-3">
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a class="btn btn-outline-secondary" href="{% url 'sectors_page' %}">Cancelar</a>
        </div>
      </div>
    </form>
  </div>
  <script>
    const areaInput = document.getElementById("area_id");
    const departmentInput = document.getElementById("department_id");

    function updateDepartmentOptions() {
      if (!areaInput || !departmentInput) return;
      const areaId = areaInput.value;
      Array.from(departmentInput.options).forEach(function (option, index) {
        if (index === 0) {
          option.hidden = false;
          return;
        }
        option.hidden = !!areaId && option.dataset.areaId !== areaId;
      });
      if (departmentInput.selectedOptions.length && departmentInput.selectedOptions[0].hidden) {
        departmentInput.value = "";
      }
    }

    if (areaInput && departmentInput) {
      areaInput.addEventListener("change", updateDepartmentOptions);
      updateDepartmentOptions();
    }
  </script>
{% endblock %}
